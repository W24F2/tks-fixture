<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sports Fixtures{% endblock %}</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='FS.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sports Fetcher">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='FS.svg') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='FS.png') }}">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Using Inter font for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons for a premium feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
    <div class="liquid-glow"></div>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Sports<span class="accent">Fetcher</span></a>
            <div class="navbar-right">
                <div class="navbar-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total:</span>
                        <span id="stat-total" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Updated:</span>
                        <span id="stat-updated" class="stat-value">Never</span>
                    </div>
                </div>
                <a href="https://github.com/W24F2/tks-fixture" target="_blank" class="nav-github-link">
                    <i data-lucide="github" class="icon-sm"></i>
                    <span>GitHub</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Sports Fetcher. Licensed under <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank" class="license-link">Apache License 2.0</a>.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
