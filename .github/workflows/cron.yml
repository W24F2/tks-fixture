name: Trigger Vercel Scraper

on:
  schedule:
    # 1. Tuesday: Every 15 mins from 13:00 (1 PM) to 23:45 (11:45 PM) UTC
    - cron: '*/15 13-23 * * 2'
    # 2. Wednesday to Saturday: Every 15 mins, all day (00:00 to 23:45) UTC
    - cron: '*/15 * * * 3-6'
  workflow_dispatch:

jobs:
  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel API
        run: |
          curl -X GET "https://tks-sport.vercel.app/api/cron/refresh?token=${{ secrets.CRON_SECRET }}" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"